  <path d="M42 25 L58 25 Q58 35 50 35 Q42 35 42 25" fill="#eeafba" /> <!-- Glowing Blue Visor -->
  <path d="M44 27 L50 27" stroke="#fff" stroke-width="1" opacity="0.8" /> <!-- Reflection -->

  <!-- 4. Thrusters (Orange Energy Burst) -->
  <path d="M35 85 L30 95 L40 92 Z" fill="#e67e22" />
  <path d="M65 85 L70 95 L60 92 Z" fill="#e67e22" />

  <!-- 5. Armored Shoulders -->
  <circle cx="35" cy="45" r="5" fill="#8c4f4f" />
  <circle cx="65" cy="45" r="5" fill="#8c4f4f" />
</svg>
