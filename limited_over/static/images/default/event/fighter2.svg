<svg width="400" height="400" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- 1. The Winged Jetpack/Mantle (Aerodynamics) -->
  <path d="M10 40 L50 30 L90 40 L80 65 L20 65 Z" fill="#ac6f6f" />
  <path d="M10 40 L30 50 M90 40 L70 50" stroke="#5c1f1f" stroke-width="2" />

  <!-- 2. The Flight Suit (Tactical Blue/Grey) -->
  <path d="M35 45 L65 45 L60 85 L40 85 Z" fill="#bc7f7f" />
  <!-- Center Oxygen/Power Line -->
  <path d="M50 45 L50 85" stroke="#5c1f1f" stroke-width="1" opacity="0.5" />

  <!-- 3. The Tech Visor (Modern Blue Glow) -->
