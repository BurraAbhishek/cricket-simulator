
<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
  <!-- Scale Pattern for the Head -->
  <pattern id="scales" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M5,0 L10,5 L5,10 L0,5 Z" fill="#FF99FF" stroke="#2d3319" stroke-width="0.5"/>
      <path d="M5,0 L0,0 L0,5 Z" fill="#FFCC99"/>
      <path d="M5,10 L10,10 L10,5 Z" fill="#FFCC99"/>
      <path d="M5,0 L10,0 L10,5 Z" fill="#FFCC99"/>
      <path d="M0,5 L0,10 L5,10 Z" fill="#FFCC99"/>
  </pattern>
  <!-- Granular Texture for Mouth Lining -->
  <pattern id="mouthTexture" x="0" y="0" width="4" height="4" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.8" fill="#d08b90" opacity="0.5"/>
  </pattern>
    <!-- Deepest part of the throat -->
    <radialGradient id="throat" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#1a0000" />
      <stop offset="100%" style="stop-color:#6b1a1a" />
    </radialGradient>
  </defs>

  <!-- 1. THE SEALED MOUTH (All 4 Sides) -->
  <!-- cover the mouth -->
  <path d="M110,320 Q200,395 290,320 L340,180 Q200,200 60,180 Z" fill="#6f1c26"/>
  <!-- Back/Interior Tunnel -->
  <ellipse cx="200" cy="230" rx="75" ry="90" fill="url(#throat)" />

  <!-- 2. HEAD BASE (Top & Back) -->
  <path d="M60,180 Q60,80 200,80 Q340,80 340,180 Q340,180 200,200 Q200,200 60,180" fill="url(#scales)" stroke="#2d3319" stroke-width="2"/>
  <path d="M60,180 Q60,80 200,80 Q340,80 340,180 Q340,180 200,200 Q200,200 60,180" fill="url(#scales)" stroke="#2d3319" stroke-width="2"/>

  <!-- SIDE WALLS (Commissures): These close the gap between top and bottom -->
  <path d="M60,180 Q75,250 110,320 L130,220 Z" fill="#9e5a63" stroke="#5e0b15" stroke-width="1" />
  <path d="M340,180 Q325,250 290,320 L270,220 Z" fill="#9e5a63" stroke="#5e0b15" stroke-width="1" />

  <!-- LOWER JAW (The "Floor" - attached to the commissures) -->
  <path d="M110,320 Q200,395 290,320 L340,180 Q200,200 60,180 Z" fill="#f8a8a8" fill-opacity="0.5" stroke="#8b1a1a" stroke-width="1"/>

  <!-- Center and side Fang cover -->
  <path d="M60,180 Q200,200 340,180 Q200,225 60,180" fill="#ffaaaa" />

  <!-- 3. SHARP NEEDLE FANGS (Connected to the Upper Palate) -->
  <!-- Left Fang -->
  <path d="M140,189 L136,210 Q132,220 144,250 L146,250 Q138,220 144,189 Z" fill="#ffffff" fill-opacity="0.9" />
  <!-- Right Fang -->
  <path d="M260,189 L264,210 Q268,220 256,250 L254,250 Q262,220 256,189 Z" fill="#ffffff" fill-opacity="0.9" />
  <!-- Left Fang Cover -->
  <path d="M128,189 Q138,250 148,189 Z" fill="#ffaaaa" />
  <!-- Right Fang Cover -->
  <path d="M252,189 Q262,250 272,189 Z" fill="#ffaaaa" />

  <!-- 4. ANATOMICAL DETAILS -->
  <!-- Glottis (Breathing tube on the floor) -->
  <circle cx="200" cy="340" r="6" fill="#3a0000" fill-opacity="0.5" />
  
  <!-- Heat Pits -->
  <ellipse cx="170" cy="180" rx="7" ry="4" fill="black" transform="rotate(30 170 180)" />
  <ellipse cx="230" cy="180" rx="7" ry="4" fill="black" transform="rotate(-30 230 180)" />

  <!-- Aggressive Eyes & Brow Ridge -->
  <g>
    <!-- left eye -->
    <circle cx="105" cy="150" r="14" fill="#ffcc00" stroke="#1a1a1a" />
    <path d="M105,140 Q100,150 105,160 Q110,150 105,140" fill="black" stroke="black" />
    <!-- right eye -->
    <circle cx="295" cy="150" r="14" fill="#ffcc00" stroke="#1a1a1a" />
    <path d="M295,140 Q300,150 295,160 Q290,150 295,140" fill="black" stroke="black" />
    <!-- Deeply angled brow scales -->
    <path d="M75,135 Q105,115 140,155" fill="none" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
    <path d="M325,135 Q295,115 260,155" fill="none" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
