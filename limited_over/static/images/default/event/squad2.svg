  </g>

  <!-- Right Member -->
  <g stroke="#302020" stroke-width="1">
    <circle cx="65" cy="45" r="8" fill="#BC7F7F" />
    <path d="M55 55 Q65 50 75 55 L75 80 L55 80 Z" fill="#BC7F7F" />
  </g>
  
  <!-- "Underline" for stability -->
  <rect x="20" y="88" width="60" height="4" rx="2" fill="#2C3E50" />
