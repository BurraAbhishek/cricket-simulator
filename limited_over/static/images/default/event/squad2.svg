    <circle cx="35" cy="45" r="8" fill="#BC7F7F" />
    <path d="M25 55 Q35 50 45 55 L45 80 L25 80 Z" fill="#BC7F7F" />
  </g>
  
  <!-- Center Leader (Slightly larger) -->
  <g stroke="#302020" stroke-width="1">
