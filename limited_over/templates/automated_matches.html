<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, viewport-fit=cover"
        />
        {% load static %}
        <link rel="stylesheet" href="{% static 'summary_dark.css' %}" />
        <style>
            .main-title {
                font-size: 2.5em;
                text-align: center;
            }
            .main-replay {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }
            .main-replay a {
                padding: 1%;
                font-size: 1.5em;
            }
        </style>
        <title>Live Tournament</title>
    </head>
    <body>
        <h1 class="main-title" id="player-name">
            {{ current_match_number }} of {{ total_matches }} matches played
        </h1>
        <script>
            setTimeout(function () {
                window.location.href = "/play/from/{{ current_match_number }}";
            }, 1000);
        </script>
    </body>
</html>
