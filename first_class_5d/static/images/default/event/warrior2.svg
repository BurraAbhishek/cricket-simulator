    <!-- 4. The Corinthian Helmet with Plume -->
    <path d="M42 10 Q50 0 58 10 L58 25 L42 25 Z" fill="#c0392b" /> <!-- Red Plume -->
    <path d="M40 22 L60 22 L60 42 Q50 35 40 42 Z" fill="#cd7f32" /> <!-- Bronze Helm -->
    <rect x="49" y="32" width="2" height="10" fill="#2c3e50" /> <!-- Eye Slit -->
  
    <!-- 5. Greaves (Leg Armor) -->
    <rect x="40" y="75" width="6" height="18" rx="2" fill="#aa5577" />
    <rect x="54" y="75" width="6" height="18" rx="2" fill="#aa5577" />

    <!-- 1. The Spear (Long Diagonal for Motion) -->
    <line x1="85" y1="10" x2="35" y2="90" stroke="#7f8c8d" stroke-width="2" />
    <path d="M78 15 L86 5 L84 18 Z" fill="#bdc3c7" stroke="#bdc3c7" stroke-width="1" />
    
    <!-- 3. The Round Shield (The 'Aspis') -->
