<svg width="400" height="400" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- 1. Fur Mantle (The "Bulk") -->
  <path d="M25 35 Q50 25 75 35 L80 60 L20 60 Z" fill="#5d4037" /> <!-- Dark Brown Fur -->
  <path d="M25 35 Q50 30 75 35" fill="none" stroke="#3e2723" stroke-width="3" stroke-dasharray="2,2" />

  <!-- 2. The Body (Leather Armor) -->
  <path d="M35 55 L65 55 L70 90 L30 90 Z" fill="#3e2723" />
  <!-- Leather Straps/Cross-brace -->
  <path d="M35 55 L65 90 M65 55 L35 90" stroke="#795548" stroke-width="2" />

  <!-- 3. Dual Bearded Axes -->
  <!-- Left Axe -->
  <rect x="15" y="45" width="3" height="40" transform="rotate(15 15 45)" fill="#4e342e" />
  <path d="M5 40 Q15 35 25 45 L15 50 Z" fill="#9e9e9e" stroke="#424242" stroke-width="1" />
  <!-- Right Axe -->
  <rect x="82" y="45" width="3" height="40" transform="rotate(-15 82 45)" fill="#4e342e" />
  <path d="M95 40 Q85 35 75 45 L85 50 Z" fill="#9e9e9e" stroke="#424242" stroke-width="1" />

  <!-- 4. Horned Helmet -->
  <path d="M40 30 Q50 20 60 30 L58 40 L42 40 Z" fill="#212121" />
  <!-- Horns -->
  <path d="M40 30 Q30 20 35 10" fill="none" stroke="#eeeeee" stroke-width="4" stroke-linecap="round" />
  <path d="M60 30 Q70 20 65 10" fill="none" stroke="#eeeeee" stroke-width="4" stroke-linecap="round" />
  
  <!-- 5. Battle Mask / Eye Slit -->
  <rect x="42" y="32" width="16" height="3" fill="#000" />
</svg>

