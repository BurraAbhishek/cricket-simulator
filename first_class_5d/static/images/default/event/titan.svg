<svg width="400" height="400" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Define a sleek metallic gradient -->
  <defs>
    <linearGradient id="titanTGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#95a5a6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#bdc3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7f8c8d;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- The main 'T' shape -->
  <path d="M25 15 L75 15 L75 30 L58 30 L58 85 L42 85 L42 30 L25 30 Z" 
        fill="url(#titanTGradient)" stroke="#2c3e50" stroke-width="1" />

  <!-- A subtle accent (optional, adds a team color) -->
  <rect x="25" y="15" width="50" height="5" fill="#e74c3c" />
</svg>

